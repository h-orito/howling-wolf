# ==============================================
# Netlify Configuration for HOWLING WOLF UI
# ==============================================

[build]
  # ビルドコマンド
  command = "pnpm install && pnpm exec nuxt generate"
  # 公開ディレクトリ（Nuxt generate の出力先）
  publish = "dist"
  # Node.js バージョン
  [build.environment]
    NODE_VERSION = "22"

# ==============================================
# ブランチごとのビルド設定
# ==============================================

# feature/nuxt4 ブランチ用の設定
[context.feature-nuxt4]
  command = "pnpm install && pnpm exec nuxt generate"

# プルリクエスト用のプレビュー設定
[context.deploy-preview]
  command = "pnpm install && pnpm exec nuxt generate"

# ==============================================
# リダイレクト設定（SPA用）
# ==============================================
# すべてのルートを index.html にフォールバック

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==============================================
# ヘッダー設定
# ==============================================

# セキュリティヘッダー
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # まずは Report-Only で違反の有無を確認する（ブロックはしない）。Netlify が 1 つの値として返すよう 1 行で書く
    # - 'self': アプリ本体・画像・Service Worker・Firebase Auth の iframe（/__/auth/* は firebaseapp.com へプロキシ）
    # - frame-src の howling-wolf.com: Firebase Auth の iframe（authDomain）。本番ドメイン以外（プレビューなど）で開いたときのため
    # - wolfort.dev: API / wolfort.net: キャラクター画像
    # - apis.google.com, *.googleapis.com: Firebase Auth（Google / Twitter ログイン）
    # - pagead2.googlesyndication.com ほか: Google AdSense
    # - www.googletagmanager.com, *.google-analytics.com: Google Analytics（計測 ID 設定時のみ読み込む）
    # - static.cloudflareinsights.com / cloudflareinsights.com: Cloudflare Web Analytics（Cloudflare が挿入する）
    # - connect-src の wolfort.net / fonts.*: Service Worker（workbox の runtimeCaching）が画像・フォントを fetch で取得するため
    # - script-src の 'unsafe-inline': nuxt generate が出力するインラインスクリプト（importmap・実行時設定）のため
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://pagead2.googlesyndication.com https://*.adtrafficquality.google https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://wolfort.net https://pagead2.googlesyndication.com https://*.adtrafficquality.google https://*.google.com https://*.doubleclick.net https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://wolfort.dev https://wolfort.net https://fonts.googleapis.com https://fonts.gstatic.com https://*.googleapis.com https://pagead2.googlesyndication.com https://*.adtrafficquality.google https://*.google.com https://*.doubleclick.net https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cloudflareinsights.com; frame-src 'self' https://howling-wolf.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.adtrafficquality.google https://www.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# 静的アセットのキャッシュ設定（ハッシュ付きファイル）
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 画像のキャッシュ設定
[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Service Worker はキャッシュしない
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
