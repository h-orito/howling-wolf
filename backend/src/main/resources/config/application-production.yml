spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${HOWLING_WOLF_DB_NAME}?character_set_server=utf8mb4
    username: ${HOWLING_WOLF_DB_USERNAME}
    password: ${HOWLING_WOLF_DB_PASSWORD}
    driverClassName: com.mysql.jdbc.Driver
    type: org.apache.tomcat.jdbc.pool.DataSource
    tomcat:
      # wolf-db は全アプリで共有しており接続数上限も有限なため、
      # プール上限を明示して DB への同時接続数を固定する（配分は運用ドキュメント側で管理）。
      # 上限到達時は max-wait まで待ち、取得できなければ PoolExhaustedException になる
      max-active: 20
      max-idle: 20
      min-idle: 3
      initial-size: 3
      max-wait: 10000
      # アイドル接続が MySQL 側 (wait_timeout) で切られていても掴まないよう、貸出時に検証する
      test-on-borrow: true
      validation-query: SELECT 1
      validation-interval: 30000
  messages:
    basename: messages
    cache-duration: -1
    encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE
security:
  corsClientUrls:
    - https://howling-wolf.com
server:
  port: 8086
  servlet:
    context-path: /howling-wolf
    session:
      timeout: 86400
  compression:
    enabled: true
  tomcat:
    basedir: /app/logs
    accesslog:
      enabled: true
      suffix: .log
      prefix: howling-wolf-access_log
      file-date-format: .yyyy-MM-dd
      max-days: 14
      pattern: '%t "%r" %s %b "%{Referer}i" "%{User-Agent}i" %{CF-Connecting-IP}i %D %S %I'
    remoteip.remote-ip-header: true
    use-forward-headers: true
logging:
  level:
    org.springframework: INFO
    root: INFO
    org.seasar.dbflute: ERROR
  file.name: /app/logs/howling-wolf.log
slack.token: ${SLACK_TOKEN}
twitter:
  oauth:
    consumer-key: ${TWITTER_CONSUMER_KEY}
    consumer-secret: ${TWITTER_CONSUMER_SECRET}
    access-token: ${TWITTER_ACCESS_TOKEN}
    access-token-secret: ${TWITTER_ACCESS_TOKEN_SECRET}

firebase:
  adminsdk:
    secretkey:
      path: ${HOWLING_WOLF_FIREBASE_ADMINSDK_PATH}
  database:
    url: ${HOWLING_WOLF_FIREBASE_DATABASE_URL}

discord:
  webhook-url: ${HOWLING_WOLF_DISCORD_WEBHOOK_URL}
  master-userid: ${HOWLING_WOLF_DISCORD_MASTER_USERID}
